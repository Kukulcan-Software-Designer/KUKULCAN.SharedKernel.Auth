name: Database Configuration Contract

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - Develop
  workflow_dispatch:

jobs:
  validate-database-configuration:
    name: Enforce canonical database environment variables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject legacy database environment variables
        shell: bash
        run: |
          prefix="KUKULCAN_DATABASE_"
          forbidden_provider="${prefix}PROVIDER"
          forbidden_connection="${prefix}CONNECTION_STRING"
          forbidden_design_time_connection="KUKULCAN_CONNECTION_""STRING"

          matches=0

          for forbidden in "${forbidden_provider}" "${forbidden_connection}" "${forbidden_design_time_connection}"; do
            if git grep -n -F "${forbidden}" -- .; then
              matches=1
            fi
          done

          if [ "${matches}" -ne 0 ]; then
            echo "Legacy database environment variables are forbidden."
            exit 1
          fi

          echo "No forbidden legacy database environment variables found."

      - name: Verify canonical variables in migration factories
        shell: bash
        run: |
          provider_variable="KUKULCAN__DATABASE__PROVIDER"
          connection_variable="KUKULCAN__DATABASE__CONNECTIONSTRING"

          factories=(
            "Source/KUKULCAN.SharedKernel.Auth.Migrations.PostgreSQL/AuthDbContextFactory.cs"
            "Source/KUKULCAN.SharedKernel.Auth.Migrations.SQLServer/AuthDbContextFactory.cs"
            "Source/KUKULCAN.SharedKernel.Auth.Migrations.MySQL/AuthDbContextFactory.cs"
          )

          for factory in "${factories[@]}"; do
            test -f "${factory}"
            grep -Fq "${provider_variable}" "${factory}" || {
              echo "Missing ${provider_variable} in ${factory}"
              exit 1
            }
            grep -Fq "${connection_variable}" "${factory}" || {
              echo "Missing ${connection_variable} in ${factory}"
              exit 1
            }
          done

      - name: Verify canonical variables in documentation and setup scripts
        shell: bash
        run: |
          provider_variable="KUKULCAN__DATABASE__PROVIDER"
          connection_variable="KUKULCAN__DATABASE__CONNECTIONSTRING"

          files=(
            "Documentation/CONFIGURATION.md"
            "Documentation/MIGRATIONS.md"
            "Documentation/Scripts/configure-database-linux.sh"
            "Documentation/Scripts/configure-database-macos.sh"
            "Documentation/Scripts/Configure-Database-Windows.ps1"
          )

          for file in "${files[@]}"; do
            test -f "${file}"
            grep -Fq "${provider_variable}" "${file}" || {
              echo "Missing ${provider_variable} in ${file}"
              exit 1
            }
            grep -Fq "${connection_variable}" "${file}" || {
              echo "Missing ${connection_variable} in ${file}"
              exit 1
            }
          done
