name: Auth Integration Tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgresql-integration-tests:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify Docker runtime
        run: docker info
      - name: Restore
        run: dotnet restore Tests/KUKULCAN.SharedKernel.Auth.PostgreSQL.Integration/KUKULCAN.SharedKernel.Auth.PostgreSQL.Integration.csproj
      - name: Build
        run: dotnet build Tests/KUKULCAN.SharedKernel.Auth.PostgreSQL.Integration/KUKULCAN.SharedKernel.Auth.PostgreSQL.Integration.csproj --no-restore --configuration Release
      - name: Test
        run: dotnet test Tests/KUKULCAN.SharedKernel.Auth.PostgreSQL.Integration/KUKULCAN.SharedKernel.Auth.PostgreSQL.Integration.csproj --no-build --configuration Release --logger "console;verbosity=normal"
  sqlserver-integration-tests:
    name: SQL Server integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify Docker runtime
        run: docker info
      - name: Restore
        run: dotnet restore Tests/KUKULCAN.SharedKernel.Auth.SQLServer.Integration/KUKULCAN.SharedKernel.Auth.SQLServer.Integration.csproj
      - name: Build
        run: dotnet build Tests/KUKULCAN.SharedKernel.Auth.SQLServer.Integration/KUKULCAN.SharedKernel.Auth.SQLServer.Integration.csproj --no-restore --configuration Release
      - name: Test
        run: dotnet test Tests/KUKULCAN.SharedKernel.Auth.SQLServer.Integration/KUKULCAN.SharedKernel.Auth.SQLServer.Integration.csproj --no-build --configuration Release --logger "console;verbosity=normal"
  mysql-integration-tests:
    name: MySQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify Docker runtime
        run: docker info
      - name: Restore
        run: dotnet restore Tests/KUKULCAN.SharedKernel.Auth.MySQL.Integration/KUKULCAN.SharedKernel.Auth.MySQL.Integration.csproj
