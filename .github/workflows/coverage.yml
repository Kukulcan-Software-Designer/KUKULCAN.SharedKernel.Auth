name: Code Coverage
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    name: Auth code coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify Docker runtime
        run: docker info
      - name: Create coverage settings
        shell: bash
        run: |
          cat > /tmp/auth-coverage.runsettings <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <RunSettings>
            <DataCollectionRunSettings>
              <DataCollectors>
                <DataCollector friendlyName="XPlat Code Coverage">
                  <Configuration>
                    <Format>cobertura</Format>
                    <Include>[KUKULCAN.SharedKernel.Auth]*</Include>
                    <Exclude>[KUKULCAN.SharedKernel.Auth.UnitTests]*</Exclude>
                    <Exclude>[KUKULCAN.SharedKernel.Auth.SQLServer.Integration]*</Exclude>
                    <Exclude>[KUKULCAN.SharedKernel.Auth.PostgreSQL.Integration]*</Exclude>
                    <Exclude>[KUKULCAN.SharedKernel.Auth.MySQL.Integration]*</Exclude>
                    <ExcludeByAttribute>CompilerGeneratedAttribute</ExcludeByAttribute>
                    <SingleHit>false</SingleHit>
                    <UseSourceLink>true</UseSourceLink>
                    <SkipAutoProps>true</SkipAutoProps>
                  </Configuration>
                </DataCollector>
              </DataCollectors>
            </DataCollectionRunSettings>
          </RunSettings>
          EOF
      - name: Restore solution
        run: dotnet restore KUKULCAN.SharedKernel.Auth.slnx
      - name: Build solution
        run: dotnet build KUKULCAN.SharedKernel.Auth.slnx --no-restore --configuration Release
      - name: Run unit tests with coverage
        run: >-
          dotnet test Tests/KUKULCAN.SharedKernel.Auth.UnitTests/KUKULCAN.SharedKernel.Auth.UnitTests.csproj
          --no-build --configuration Release --settings /tmp/auth-coverage.runsettings
          --logger "console;verbosity=normal" --collect:"XPlat Code Coverage"
      - name: Run PostgreSQL integration tests with coverage
        run: >-
          dotnet test Tests/KUKULCAN.SharedKernel.Auth.PostgreSQL.Integration/KUKULCAN.SharedKernel.Auth.PostgreSQL.Integration.csproj
          --no-build --configuration Release --settings /tmp/auth-coverage.runsettings
          --logger "console;verbosity=normal" --collect:"XPlat Code Coverage"
      - name: Run SQL Server integration tests with coverage
        run: >-
          dotnet test Tests/KUKULCAN.SharedKernel.Auth.SQLServer.Integration/KUKULCAN.SharedKernel.Auth.SQLServer.Integration.csproj
          --no-build --configuration Release --settings /tmp/auth-coverage.runsettings
          --logger "console;verbosity=normal" --collect:"XPlat Code Coverage"
      - name: Run MySQL integration tests with coverage
        run: >-
          dotnet test Tests/KUKULCAN.SharedKernel.Auth.MySQL.Integration/KUKULCAN.SharedKernel.Auth.MySQL.Integration.csproj
          --no-build --configuration Release --settings /tmp/auth-coverage.runsettings
          --logger "console;verbosity=normal" --collect:"XPlat Code Coverage"
      - name: Upload unit coverage
        uses: actions/upload-artifact@v4
        with:
          name: kukulcan-sharedkernel-auth-unit-coverage
          path: Tests/KUKULCAN.SharedKernel.Auth.UnitTests/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
      - name: Upload PostgreSQL coverage
        uses: actions/upload-artifact@v4
        with:
          name: kukulcan-sharedkernel-auth-postgresql-coverage
          path: Tests/KUKULCAN.SharedKernel.Auth.PostgreSQL.Integration/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
      - name: Upload SQL Server coverage
        uses: actions/upload-artifact@v4
        with:
          name: kukulcan-sharedkernel-auth-sqlserver-coverage
          path: Tests/KUKULCAN.SharedKernel.Auth.SQLServer.Integration/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
      - name: Upload MySQL coverage
        uses: actions/upload-artifact@v4
        with:
          name: kukulcan-sharedkernel-auth-mysql-coverage
          path: Tests/KUKULCAN.SharedKernel.Auth.MySQL.Integration/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
