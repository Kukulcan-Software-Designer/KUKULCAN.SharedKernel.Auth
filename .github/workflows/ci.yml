name: CI
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    name: Validate Auth (restore, build and test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify Docker runtime
        run: docker info
      - name: Restore solution
        run: dotnet restore KUKULCAN.SharedKernel.Auth.slnx
      - name: Build solution
        run: dotnet build KUKULCAN.SharedKernel.Auth.slnx --no-restore --configuration Release
      - name: Run unit tests
        run: dotnet test Tests/KUKULCAN.SharedKernel.Auth.UnitTests/KUKULCAN.SharedKernel.Auth.UnitTests.csproj --no-build --configuration Release --logger "console;verbosity=normal"
      - name: Run PostgreSQL integration tests
        run: dotnet test Tests/KUKULCAN.SharedKernel.Auth.PostgreSQL.Integration/KUKULCAN.SharedKernel.Auth.PostgreSQL.Integration.csproj --no-build --configuration Release --logger "console;verbosity=normal"
      - name: Run SQL Server integration tests
        run: dotnet test Tests/KUKULCAN.SharedKernel.Auth.SQLServer.Integration/KUKULCAN.SharedKernel.Auth.SQLServer.Integration.csproj --no-build --configuration Release --logger "console;verbosity=normal"
      - name: Run MySQL integration tests
        run: dotnet test Tests/KUKULCAN.SharedKernel.Auth.MySQL.Integration/KUKULCAN.SharedKernel.Auth.MySQL.Integration.csproj --no-build --configuration Release --logger "console;verbosity=normal"
